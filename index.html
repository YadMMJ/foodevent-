<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: home = grid of restaurant tiles; each restaurant = its own menu page (hash route) with a colored header and a simple dish list */
:root{
  --bg:#f6f7f2; --surface:#ffffff; --ink:#1d2620; --muted:#5d6a61; --line:#e2e6dd; --onr:#ffffff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121713;--surface:#1b221d;--ink:#eef2ec;--muted:#a3b0a6;--line:#2c362f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121713;--surface:#1b221d;--ink:#eef2ec;--muted:#a3b0a6;--line:#2c362f;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
/* home */
.home-head{padding-block:32px 20px;display:grid;gap:8px}
.home-head h1{font-size:clamp(32px,7vw,50px);font-weight:800;line-height:1}
.home-head p{margin:0;color:var(--muted);max-width:56ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{display:grid;grid-template-rows:auto 1fr;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tile .cover{display:grid;grid-template-columns:repeat(3,1fr);aspect-ratio:3/1.15;background:var(--r)}
.tile .cover img{width:100%;height:100%;object-fit:cover;display:block}
.tile .t{padding:12px 14px 14px;display:grid;gap:2px;border-top:5px solid var(--r)}
.tile h2{font-size:21px;font-weight:700}
.tile .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tile .go{font-weight:700;font-size:14px;color:var(--ink);margin-top:6px}
/* restaurant page */
.rhead{margin-inline:-16px;padding:18px 16px 26px;background:var(--r);color:var(--onr)}
.rhead .in{max-width:860px;margin:0 auto;display:grid;gap:10px}
.back{justify-self:start;color:var(--onr);text-decoration:none;font-weight:700;font-size:15px;background:rgba(0,0,0,.18);padding:7px 13px 7px 10px;border-radius:999px}
.rhead h1{font-size:clamp(32px,8vw,54px);font-weight:800;line-height:1}
.rhead p{margin:0;opacity:.92;font-variant-numeric:tabular-nums}
.how{margin:18px 0 6px;color:var(--muted);font-size:14px}
.dishes{display:grid;gap:12px;margin-top:8px}
.dish{display:grid;grid-template-columns:130px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}
.dish img{width:130px;height:130px;object-fit:cover;border-radius:10px;display:block;background:#fff}
.dish .txt{min-width:0;display:grid;gap:4px}
.dish .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{background:var(--r);color:var(--onr);font-weight:700;font-size:13px;padding:2px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
.dish h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.dish p{margin:0;color:var(--muted);font-size:14px}
.price{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.price small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.price.na{font-size:14px;font-weight:600;color:var(--muted)}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.next a{color:var(--ink);font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:480px){.dish{grid-template-columns:96px 1fr;gap:11px}.dish img{width:96px;height:96px}.dish h3{font-size:15.5px}.dish p{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .15s}.tile:hover{transform:translateY(-3px)}}
</style>

};
const RESTS=Object.keys(META);
const fmt=n=>n.toLocaleString('en-US');
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function range(its){const p=its.map(i=>i.price).filter(Boolean);return fmt(Math.min(...p))+' – '+fmt(Math.max(...p))+' IQD'}

function home(){
  document.title='Event Food Menu';
  app.innerHTML=`<header class="home-head"><h1>Choose a restaurant</h1>
   <p>Pick a restaurant to see its menu with photos and prices. When you've decided, send the organizer the <b>dish number</b>.</p></header>
   <div class="tiles">${RESTS.map(r=>{const its=ITEMS.filter(i=>i.r===r),m=META[r];
    return `<a class="tile" href="#${m.id}" style="--r:${m.c}">
      <div class="cover">${its.slice(0,3).map(i=>`<img src="${i.img}" alt="">`).join('')}</div>
      <div class="t"><h2>${esc(r)}</h2><div class="meta">${m.tag}</div><div class="meta">${its.length} dishes · ${range(its)}</div><div class="go">See menu →</div></div></a>`}).join('')}</div>`;
}
function rest(r){
  const m=META[r], its=ITEMS.filter(i=>i.r===r), k=RESTS.indexOf(r);
  const prev=RESTS[k-1], next=RESTS[k+1];
  document.title=r+' · Event Food Menu';
  app.innerHTML=`<header class="rhead" style="--r:${m.c}"><div class="in">
     <a class="back" href="#home">← All restaurants</a><h1>${esc(r)}</h1><p>${m.tag} · ${its.length} dishes · ${range(its)}</p></div></header>
   <p class="how">Tell the organizer the number of the dish you want.</p>
   <div class="dishes" style="--r:${m.c}">${its.map(i=>`<article class="dish">
      <img src="${i.img}" alt="${esc(i.name)}" loading="lazy">
      <div class="txt"><div class="top"><span class="num">#${i.n}</span><h3>${esc(i.name)}</h3></div>
      ${i.desc?`<p>${esc(i.desc)}</p>`:''}
      ${i.price?`<div class="price">${fmt(i.price)}<small>IQD</small></div>`:`<div class="price na">Price not listed, ask the organizer</div>`}</div></article>`).join('')}</div>
   <nav class="next">${prev?`<a href="#${META[prev].id}">← ${esc(prev)}</a>`:'<span></span>'}${next?`<a href="#${META[next].id}">${esc(next)} →</a>`:`<a href="#home">All restaurants</a>`}</nav>`;
}
function route(){
  const h=location.hash.slice(1); const r=RESTS.find(x=>META[x].id===h);
  r?rest(r):home(); window.scrollTo(0,0);
}
addEventListener('hashchange',route); route();
</script>
